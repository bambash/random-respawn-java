name: Auto Semver

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release)') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Determine bump type
        id: bump
        run: |
          # Get commits since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --oneline --no-merges)
          else
            COMMITS=$(git log "${LAST_TAG}..HEAD" --oneline --no-merges)
          fi

          echo "=== Commits since last tag ==="
          echo "$COMMITS"

          # Check for conventional commit prefixes
          if echo "$COMMITS" | grep -qiE '^\w+ (BREAKING CHANGE|.+!:)'; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qiE '^feat(\(.+\))?:'; then
            BUMP="minor"
          else
            BUMP="patch"
          fi

          # Also check PR labels (takes precedence if set)
          PR_NUMBER=$(echo "${{ github.event.head_commit.message }}" | grep -oP '#\K\d+' | head -1 || echo "")
          if [ -n "$PR_NUMBER" ]; then
            LABELS=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' 2>/dev/null || echo "")
            echo "=== PR labels ==="
            echo "$LABELS"
            if echo "$LABELS" | grep -q 'bump:major'; then
              BUMP="major"
            elif echo "$LABELS" | grep -q 'bump:minor'; then
              BUMP="minor"
            elif echo "$LABELS" | grep -q 'bump:patch'; then
              BUMP="patch"
            fi
          fi

          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Bump type: $BUMP"
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}

      - name: Bump version
        id: version
        run: |
          # Read current version from pack.mcmeta
          VERSION=$(jq -r '.pack.version' pack.mcmeta)
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          echo "Current version: $MAJOR.$MINOR.$PATCH"

          BUMP="${{ steps.bump.outputs.bump }}"
          case "$BUMP" in
            major)
              MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor)
              MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch)
              PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update pack.mcmeta
        run: |
          VERSION="${{ steps.version.outputs.new_version }}"
          jq --arg v "$VERSION" '.pack.version = $v' pack.mcmeta > pack.tmp.json && mv pack.tmp.json pack.mcmeta

      - name: Update CHANGELOG.md
        run: |
          VERSION="${{ steps.version.outputs.new_version }}"
          TODAY=$(date +%Y-%m-%d)
          TAG_LINK="[${VERSION}]: https://github.com/${{ github.repository }}/releases/tag/v${VERSION}"

          # Prepend new version section
          sed -i "1i\\" CHANGELOG.md
          sed -i "1i\\$TAG_LINK" CHANGELOG.md
          sed -i "1i\\" CHANGELOG.md
          sed -i "1i\\### Changed" CHANGELOG.md
          sed -i "1i\\## [${VERSION}] — ${TODAY}" CHANGELOG.md

      - name: Commit, tag, and push
        run: |
          VERSION="${{ steps.version.outputs.new_version }}"
          git config user.name "multica-agent"
          git config user.email "github@multica.ai"
          git add pack.mcmeta CHANGELOG.md
          git commit -m "chore(release): bump to v${VERSION}"
          git tag "v${VERSION}"
          git remote set-url origin "https://x-access-token:${{ secrets.RELEASE_PAT }}@github.com/${{ github.repository }}"
          git push origin main --tags
